<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: monospace;
    }

    body {
      background: #000;
      color: #fff;
      padding: 20px;
    }

    .box {
      border: 1px solid #888;
      padding: 20px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .date {
      font-size: 30px;
      color: #ccc;
    }

    .content {
      min-height: 400px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="title">Post 1</div>
    <div class="date">Date: 27/04/2026</div>
  </div>

  <div class="box content">
      My first post...
      Not much to talk about.
  </div>

</body>
</html>
